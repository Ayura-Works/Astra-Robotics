<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0e0f12"/>
  <pattern id="ogGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0 L0 0 0 40" stroke="rgba(255,255,255,0.03)" stroke-width="1" fill="none"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#ogGrid)"/>
  <!-- logo mark -->
  <g transform="translate(100, 80)">
    <path d="M16 2 L28 28 L16 22 L4 28 Z" stroke="#00d4aa" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
    <circle cx="16" cy="16" r="2.5" fill="#00d4aa"/>
    <path d="M16 18.5 L16 22" stroke="#00d4aa" stroke-width="1.5"/>
  </g>
  <text x="145" y="108" fill="#e8eaed" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="700">ASTRA<tspan fill="#6b7280" font-weight="500"> ROBOTICS</tspan></text>
  <!-- headline -->
  <text x="100" y="300" fill="#e8eaed" font-family="Space Grotesk, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Engineering Intelligence</text>
  <text x="100" y="370" fill="#e8eaed" font-family="Space Grotesk, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Into Motion.</text>
  <!-- subtitle -->
  <text x="100" y="430" fill="#9aa0a8" font-family="Inter, sans-serif" font-size="22" font-weight="400">Intelligent robotic &amp; automation systems for complex engineering challenges.</text>
  <!-- accent line -->
  <rect x="100" y="250" width="60" height="3" fill="#00d4aa"/>
  <!-- corner annotations -->
  <text x="100" y="540" fill="#6b7280" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1.5">SYSTEM STATUS: ONLINE</text>
  <text x="100" y="565" fill="#6b7280" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1.5">PRECISION: ±0.02 mm</text>
  <!-- right side technical visual -->
  <g transform="translate(820, 150)" stroke="#3a3f4b" stroke-width="1.5" fill="none">
    <circle cx="150" cy="160" r="140" stroke-dasharray="4 4"/>
    <circle cx="150" cy="160" r="100"/>
    <circle cx="150" cy="160" r="60" stroke="#00d4aa"/>
    <line x1="150" y1="10" x2="150" y2="40"/>
    <line x1="150" y1="280" x2="150" y2="310"/>
    <line x1="10" y1="160" x2="40" y2="160"/>
    <line x1="260" y1="160" x2="290" y2="160"/>
  </g>
  <g transform="translate(970, 310)">
    <circle cx="0" cy="0" r="20" stroke="#00d4aa" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="0" r="10" stroke="#00d4aa" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="0" r="3" fill="#00d4aa"/>
  </g>
</svg>
